name: C++ RaquetteBaballe Build (with Make + Cache)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake Build
      uses: actions/cache@v4
      with:
        path: build/
        key: build-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          build-cache-${{ runner.os }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        build-essential \
        cmake \
        libx11-dev \
        libgl1-mesa-dev \
        libglu1-mesa-dev \
        libxcursor-dev \
        libxinerama-dev \
        libxrandr-dev \
        libxi-dev \
        libxext-dev \
        libpng-dev \
        libjpeg-dev \
        libfreetype6-dev \
        libvorbis-dev \
        libopenal-dev \
        libphysfs-dev \
        libgtk-3-dev

    - name: Build with Make
      run: |
        make
